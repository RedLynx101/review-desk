[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "review-desk"
version = "0.1.0"
description = "Invoice and receipt extraction with earned confidence, a review queue and a hash-chained audit log. Runs locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Exact versions live in requirements.txt. Every dependency must stay under a permissive
# license; scripts/check_licenses.py enforces that and writes THIRD_PARTY_LICENSES.md.
dependencies = [
    "numpy>=2.0",
    "pdfplumber>=0.11",
    "pillow>=11",
    "pydantic>=2.8",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
    "starlette>=0.46",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["playwright>=1.45", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_desk = ["calibration.json"]
"review_desk.desk" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: needs a Tesseract binary; skipped when none is found",
    "browser: drives the review screen through a real browser; skipped when Playwright can't start one",
]
